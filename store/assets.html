<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Store assets</title>
<!-- Store screenshots / promo tile. Rendered by scripts/store-assets.mjs:
     ?scene=1|2|3 (1280×800) or ?scene=promo (440×280). The lyrics on the
     "video" use the extension's own overlay CSS (src/content/looks.js). -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Roboto, -apple-system, Arial, sans-serif; background: #0f0f14; color: #fff; overflow: hidden; }
  .stage { width: 1280px; height: 800px; position: relative; padding: 48px 56px;
    background: radial-gradient(1200px 600px at 10% 0%, #2a1b4a 0%, transparent 60%), radial-gradient(900px 500px at 100% 100%, #3b0f2a 0%, transparent 60%), #0f0f14; }
  h1 { margin: 0 0 6px; font-size: 40px; font-weight: 800; letter-spacing: -.01em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #ff2e63, #ffb800); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 0 0 28px; font-size: 19px; color: #c9c9d6; }
  .row { display: flex; gap: 32px; align-items: flex-start; }
  .video { position: relative; width: 800px; height: 450px; border-radius: 16px; overflow: hidden; flex: none;
    background: linear-gradient(160deg, #1d3b5c 0%, #4a2f6b 45%, #b0466b 75%, #f08a4b 100%); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .video::before { content: ''; position: absolute; inset: 0; background:
    radial-gradient(circle at 70% 30%, rgba(255,255,255,.25) 0 60px, transparent 61px),
    linear-gradient(transparent 62%, rgba(0,0,0,.35) 62%); }
  .video .bar { position: absolute; left: 16px; right: 16px; bottom: 12px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); }
  .video .bar::before { content: ''; position: absolute; inset: 0 62% 0 0; background: #ff0033; border-radius: 2px; }
  .panel { width: 340px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); display: block; }
  .card { width: 340px; border-radius: 12px; background: #fff; color: #0f0f0f; padding: 14px 16px; font: 13px/1.5 ui-monospace, Menlo, monospace;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); white-space: pre; margin-top: 16px; }
  .side { display: flex; flex-direction: column; }
  .chips { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; width: 800px; }
  .chips span { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); padding: 7px 14px; border-radius: 999px; font-size: 15px; }
  /* promo tile */
  .promo { width: 440px; height: 280px; padding: 30px; display: flex; flex-direction: column; justify-content: center; gap: 14px;
    background: radial-gradient(500px 300px at 0% 0%, #2a1b4a, transparent 70%), radial-gradient(400px 260px at 100% 100%, #5a1238, transparent 70%), #0f0f14; }
  .promo .logo { display: flex; gap: 12px; align-items: center; font-weight: 800; font-size: 26px; }
  .promo .logo img { width: 52px; height: 52px; }
  .promo p { margin: 0; font-size: 17px; color: #d6d6e0; line-height: 1.35; }
  .promo .k { font: 800 30px Roboto, Arial; }
</style>
</head>
<body>
<script>
  var BYL = { settings: { value: {} } };
  var chrome = { runtime: { getURL: (p) => '../' + p } };
</script>
<script src="../src/i18n.js"></script>
<script src="../src/content/looks.js"></script>
<script>
  const scene = new URLSearchParams(location.search).get('scene') || '1';
  const h = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };

  // A lyric overlay like the one on the video: cur line lit up to `lit` chars.
  function overlay(video, styleKey, cur, next, lit, fontPx) {
    const host = h('div');
    video.append(host);
    const root = host.attachShadow({ mode: 'open' });
    const st = h('style');
    st.textContent = BYL.look.OVERLAY_CSS;
    root.append(st);
    const look = BYL.look.compose(styleKey);
    BYL.look.paintLook(host, look);
    host.style.fontSize = fontPx + 'px';
    const ov = h('div', 'ov');
    const line = (text, cls, track) => {
      const l = h('div', 'l ' + cls);
      let n = 0;
      text.split(' ').forEach((w, i) => {
        if (i) l.append(document.createTextNode(' '));
        const s = h('span', 'w');
        s.dataset.t = w;
        s.append(h('span', 'b', w));
        if (track) {
          const f = h('span', 'f', w);
          s.append(f);
          const p = Math.max(0, Math.min(1, (lit - n) / w.length));
          if (p > 0) s.classList.add('s');
          s.style.setProperty('--p', p >= 1 ? '130%' : p * 100 + '%');
        }
        n += w.length;
        l.append(s);
      });
      return l;
    };
    ov.append(line(cur, 'cur', true), line(next, 'next', false));
    root.append(ov);
  }

  function stage(title, sub, chips) {
    const s = h('div', 'stage');
    const t = h('h1');
    t.innerHTML = title;
    s.append(t, h('p', 'sub', sub));
    const row = h('div', 'row');
    const left = h('div');
    const video = h('div', 'video');
    video.append(h('div', 'bar'));
    left.append(video);
    if (chips) {
      const c = h('div', 'chips');
      for (const x of chips) c.append(h('span', '', x));
      left.append(c);
    }
    row.append(left);
    s.append(row);
    document.body.append(s);
    return { row, video };
  }

  if (scene === '1') {
    const { row, video } = stage('Lời bài hát &amp; <em>karaoke</em> ngay trên YouTube',
      'Tự tìm lời trong mô tả, comment, LRCLIB, Hợp âm chuẩn, phụ đề. Chữ đổi màu theo nhịp hát.',
      ['🎤 Karaoke trên video', '⧉ Cửa sổ nổi', '🌐 Song ngữ', '🔤 Phiên âm', '⌨ Phím tắt']);
    overlay(video, 'classic', 'Hát cùng nhau nào, Better Lyric', 'Lệch một chút thôi, ghim lại là xong', 14, 34);
    const img = h('img', 'panel');
    img.src = 'p-lyrics.png';
    row.append(img);
  } else if (scene === '2') {
    const { row, video } = stage('Kiểu chữ <em>theo ý bạn</em>',
      '7 kiểu có sẵn, 5 kiểu nền, màu, viền, phông, lề… Lưu thành preset, hoặc ghim 📌 riêng cho từng kênh.');
    overlay(video, 'captions', 'Chữ đổi màu theo từng nhịp tim', 'Hát cùng nhau nào, Better Lyric', 17, 34);
    const img = h('img', 'panel');
    img.src = 'p-studio.png';
    row.append(img);
  } else if (scene === '3') {
    const { row, video } = stage('Canh nhịp xong, <em>xuất file</em> mang đi',
      'Tự canh theo phụ đề, gõ nhịp bằng Space, ghim 📍. Xuất LRC / SRT, hoặc chia sẻ lên LRCLIB.');
    overlay(video, 'box', 'Xuất ra file SRT, mang đi khắp nơi', 'Song ngữ, phiên âm, đủ cả rồi', 22, 32);
    const side = h('div', 'side');
    const img = h('img', 'panel');
    img.src = 'p-export.png';
    const srt = h('div', 'card', '1\n00:00:20,000 --> 00:00:23,950\nXuất ra file SRT, mang đi khắp nơi\n\n2\n00:00:24,000 --> 00:00:27,950\nSong ngữ, phiên âm, đủ cả rồi');
    side.append(img, srt);
    row.append(side);
  } else {
    const p = h('div', 'promo');
    const logo = h('div', 'logo');
    const ic = h('img');
    ic.src = '../icons/icon128.png';
    logo.append(ic, h('span', '', 'Better YouTube Lyric'));
    p.append(logo, h('p', '', 'Lời bài hát, karaoke, song ngữ và phiên âm ngay trên YouTube.'));
    document.body.append(p);
  }
</script>
</body>
</html>
