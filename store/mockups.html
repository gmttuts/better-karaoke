<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Store mockups</title>
<!-- Chrome Web Store images built around real screenshots of the extension on
     YouTube (store/shots/*.png). Rendered by scripts/store-assets.mjs:
     ?scene=hero|styles|karaoke|sound|studio|promo|marquee&lang=vi|en
     shots/style-*.png are 1280 wide (theater, dark); panel-, sing-, studio-*.png
     are 1440 wide (default layout, light). -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Roboto, -apple-system, 'Segoe UI', Arial, sans-serif; color: #fff; background: #0f0f14; overflow: hidden; }
  .stage { width: 1280px; height: 800px; position: relative; padding: 44px 56px;
    background: radial-gradient(1200px 600px at 10% 0%, #2a1b4a 0%, transparent 60%), radial-gradient(900px 500px at 100% 100%, #3b0f2a 0%, transparent 60%), #0f0f14; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: #c9c9d6; margin-bottom: 14px; }
  .brand img { width: 28px; height: 28px; }
  h1 { margin: 0 0 8px; font-size: 42px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #ff2e63, #ffb800); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 0 0 26px; font-size: 19px; color: #c9c9d6; }
  .frame { border-radius: 14px; overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.12); background: #000; }
  .frame img { display: block; width: 100%; }
  .crop { position: relative; overflow: hidden; }
  .crop img { position: absolute; display: block; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 22px; }
  .tile .crop { border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.12); }
  .tile b { display: block; margin-top: 9px; font-size: 17px; font-weight: 600; color: #e6e6ef; }
  .cards { display: flex; flex-direction: column; gap: 16px; }
  .card { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.13); border-radius: 14px; padding: 16px 18px; }
  .card b { display: block; font-size: 20px; margin-bottom: 4px; }
  .card span { font-size: 15.5px; color: #c9c9d6; line-height: 1.4; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  .chips span { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); padding: 7px 14px; border-radius: 999px; font-size: 15px; }
  @font-face { font-family: 'RCl'; src: url(../fonts/rc-latin.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'RCv'; src: url(../fonts/rc-vietnamese.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'RCe'; src: url(../fonts/rc-latin-ext.woff2) format('woff2'); font-weight: 100 900; }
  /* Promo tile and marquee: the icon's red, big and loud. */
  .hot { position: relative; overflow: hidden; color: #fff;
    background: radial-gradient(60% 80% at 22% 30%, #ff7a95 0%, rgba(255,122,149,0) 70%), radial-gradient(70% 90% at 100% 100%, #b80d3a 0%, rgba(184,13,58,0) 70%), linear-gradient(135deg, #ff4d6d 0%, #f72a52 45%, #d9133f 100%); }
  .hot .rays { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg at 30% 40%, rgba(255,255,255,.07) 0deg 9deg, transparent 9deg 18deg); }
  .hot .note { position: absolute; color: rgba(255,255,255,.55); font-weight: 700; text-shadow: 0 4px 12px rgba(120,0,30,.35); }
  .hot .icon { position: absolute; border-radius: 22%; border: solid #fff; box-shadow: 0 22px 50px rgba(110,0,30,.55), 0 0 0 1px rgba(0,0,0,.05); }
  .hot .wm { font-family: RCl, RCv, RCe, 'Arial Narrow', sans-serif; line-height: .9; text-transform: uppercase; }
  .hot .wm small { display: block; font-weight: 700; letter-spacing: .32em; opacity: .9; }
  .hot .wm b { display: block; font-weight: 900; letter-spacing: -.01em; text-shadow: 0 6px 0 #a30a33, 0 14px 30px rgba(110,0,30,.45); }
  /* A karaoke line caught half sung: the sung part in yellow over the white. */
  .hot .sing { position: relative; display: inline-block; font-family: RCl, RCv, RCe, 'Arial Narrow', sans-serif; font-weight: 800; white-space: nowrap;
    padding: .18em .5em; border-radius: .5em; background: rgba(40,0,12,.38); }
  .hot .sing span { color: #fff; -webkit-text-stroke: .06em #3a0010; paint-order: stroke fill; }
  .hot .sing i { position: absolute; left: .5em; top: .18em; font-style: normal; color: #ffe600; -webkit-text-stroke: .06em #3a0010; paint-order: stroke fill;
    clip-path: inset(0 var(--left, 45%) 0 0); text-shadow: 0 0 .35em rgba(255,230,0,.55); }
  .hot .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .hot .pills span { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); padding: 8px 15px; border-radius: 999px; font-size: 17px; font-weight: 600; backdrop-filter: blur(4px); }
  .kara { font-weight: 800; color: #fff; -webkit-text-stroke: 0; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .kara i { font-style: normal; color: #ff2e63; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const scene = q.get('scene') || 'hero';
  const lang = q.get('lang') === 'en' ? 'en' : 'vi';
  const T = {
    vi: {
      heroH: 'Lời bài hát <em>ngay trên YouTube</em>',
      heroS: 'Mở video nhạc là có lời: dòng đang hát sáng lên và tự cuộn, karaoke chạy ngay trên video.',
      heroC: [['🔎 Tự tìm lời', 'Mô tả, comment, LRCLIB, Hợp âm chuẩn, Genius, phụ đề'], ['🎤 Karaoke trên video', 'Chữ đổi màu theo nhịp hát, bật tắt ngay trên thanh điều khiển'], ['🧭 4 chế độ gọn', 'Xem lời · Hát · Chỉnh lời · Karaoke'], ['🌐 12 ngôn ngữ', 'Đổi ngay trên đầu panel']],
      stylesH: '9 kiểu <em>phụ đề karaoke</em>',
      stylesS: 'Chọn một kiểu có sẵn, bấm 🎲 thử kiểu ngẫu nhiên, hoặc tự chỉnh rồi lưu thành preset. Ghim 📌 riêng cho từng kênh.',
      studioH: 'Kiểu chữ <em>theo ý bạn</em>',
      studioS: 'Bấm 🎲 để thử kiểu mới, chỉnh từng phần, ↺ để về mặc định, rồi lưu thành preset của riêng bạn.',
      studioC: ['🎲 Ngẫu nhiên', '↺ Mặc định', '💾 Lưu preset', 'Phông · Màu · Viền · Nền', 'Chuyển màu · Phát sáng', '📌 Theo kênh'],
      karaH: 'Hát theo <em>từng chữ</em> trên video',
      karaS: 'Chữ đổi màu đúng lúc ca sĩ hát, cả khi xem toàn màn hình, chế độ rạp và YouTube Shorts.',
      karaC: ['Toàn màn hình', 'Shorts', 'Cửa sổ nổi ⧉', 'Song ngữ 🌐', 'Phiên âm Hàn · Nhật · Trung 🔤'],
      soundH: 'Hát trên <em>bài gốc</em>',
      soundS: 'Không cần bản karaoke: đổi tông và lọc giọng ca sĩ ngay trong trình duyệt.',
      soundC: [['🎚 Đổi tông', 'Nâng, hạ nửa cung mà không đổi tốc độ. Nhớ riêng cho từng video.'], ['🎤 Lọc giọng', 'Giảm rõ giọng ca sĩ, giữ lại tiếng đàn, trống và bass. Kéo thanh để chỉnh mức.'], ['🎙 Chấm điểm', 'Hát vào micro, mỗi dòng có điểm: đủ lời, đúng nốt.'], ['⬇ Xuất LRC · SRT · ASS', 'Phụ đề karaoke đúng kiểu chữ, ghép cứng vào video của bạn.']],
      tag: 'Lời bài hát & karaoke ngay trên YouTube',
      promoSing: ['Hát karaoke', ' trên YouTube'],
      promoPills: ['🎤 Karaoke trên video', '🎨 9 kiểu chữ', '🎚 Tông · Lọc giọng', '🌐 12 ngôn ngữ'],
      names: { red: 'Karaoke đỏ', classic: 'Karaoke xanh dương', focus: 'Nổi bật', box: 'Khung tối', captions: 'Phụ đề YouTube', cinema: 'Dải điện ảnh', mini: 'Gọn nhẹ', fade: 'Sáng dần', big: 'Chữ lớn' },
    },
    en: {
      heroH: 'Song lyrics <em>right on YouTube</em>',
      heroS: 'Open a music video and the lyrics are there: the sung line lights up and scrolls, with karaoke on the video.',
      heroC: [['🔎 Finds lyrics', 'Description, comments, LRCLIB, Genius, captions'], ['🎤 Karaoke on video', 'Words light up as they are sung, one click on the player'], ['🧭 Four simple modes', 'Lyrics · Sing · Edit · Karaoke'], ['🌐 12 languages', 'Switch right at the top of the panel']],
      stylesH: '9 <em>karaoke subtitle</em> styles',
      stylesS: 'Pick a built-in style, roll 🎲 for a random one, or tune it and save it as a preset. Pin 📌 one per channel.',
      studioH: 'Your own <em>subtitle style</em>',
      studioS: 'Roll 🎲 for a fresh look, fine-tune each part, ↺ to start over, then save it as your own preset.',
      studioC: ['🎲 Random', '↺ Default', '💾 Save preset', 'Font · Colour · Outline · Background', 'Gradient · Glow', '📌 Per channel'],
      karaH: 'Sing along <em>word by word</em>',
      karaS: 'Words change colour right as they are sung, in full screen, theater mode and on YouTube Shorts.',
      karaC: ['Full screen', 'Shorts', 'Floating window ⧉', 'Translations 🌐', 'Korean · Japanese · Chinese romanization 🔤'],
      soundH: 'Sing over <em>the original</em>',
      soundS: 'No karaoke version needed: change the key and cut the vocals right in your browser.',
      soundC: [['🎚 Change the key', 'Semitones up or down at the same speed, remembered per video.'], ['🎤 Vocal cut', 'Turns the singer well down, keeps the band, drums and bass. Slide to set how much.'], ['🎙 Scoring', 'Sing into your mic and get a mark for every line.'], ['⬇ Export LRC · SRT · ASS', 'Styled karaoke subtitles to burn into your own video.']],
      tag: 'Song lyrics & karaoke right on YouTube',
      promoSing: ['Sing along', ' on YouTube'],
      promoPills: ['🎤 Karaoke on video', '🎨 9 styles', '🎚 Key · Vocal cut', '🌐 12 languages'],
      names: { red: 'Karaoke red', classic: 'Karaoke blue', focus: 'Spotlight', box: 'Dark box', captions: 'YouTube captions', cinema: 'Cinema band', mini: 'Compact', fade: 'Fade in', big: 'Big words' },
    },
  }[lang];

  const el = (html) => {
    const d = document.createElement('div');
    d.innerHTML = html.trim();
    return d.firstChild;
  };
  const brand = '<div class="brand"><img src="icon-source-1000.png" style="border-radius:22%">Better Karaoke</div>';
  // A window onto part of a 1280×800 screenshot: (x, y, w, h) of the source shown at `scale`.
  const crop = (src, x, y, w, h, scale, full = src.startsWith('style-') ? 1280 : 1440) =>
    `<div class="crop" style="width:${w * scale}px;height:${h * scale}px"><img src="shots/${src}.png" style="width:${full * scale}px;left:${-x * scale}px;top:${-y * scale}px"></div>`;
  // The default layout at 1440 wide: video and panel.
  const PANEL = [1021, 68, 388];
  const PLAYER = [16, 68, 989, 556];
  // The 4:3 video in the theater-mode screenshots.
  const VIDEO = [212, 56, 840, 630];

  let html;
  if (scene === 'hero') {
    // Video and panel side by side at full size, so the panel's text stays readable.
    html = `<div class="stage">${brand}<h1>${T.heroH}</h1><p class="sub" style="margin-bottom:22px">${T.heroS}</p>
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="width:700px">
          <div class="frame">${crop('panel-' + lang, ...PLAYER, 700 / 989)}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">${T.heroC.map(([b, s]) => `<div class="card" style="padding:11px 14px"><b style="font-size:16px">${b}</b><span style="font-size:13.5px">${s}</span></div>`).join('')}</div>
        </div>
        <div class="frame" style="background:#fff">${crop('panel-' + lang, PANEL[0], PANEL[1], PANEL[2], 572, 1.0)}</div>
      </div></div>`;
  } else if (scene === 'styles') {
    const keys = ['red', 'focus', 'box', 'cinema', 'fade', 'big'];
    html = `<div class="stage">${brand}<h1>${T.stylesH}</h1><p class="sub" style="margin-bottom:22px">${T.stylesS}</p>
      <div class="grid">${keys.map((k) => `<div class="tile">${crop('style-' + k, 212, 100, 840, 586, 374 / 840)}<b>${T.names[k]}</b></div>`).join('')}</div></div>`;
  } else if (scene === 'karaoke') {
    html = `<div class="stage">${brand}<h1>${T.karaH}</h1><p class="sub">${T.karaS}</p>
      <div class="frame" style="width:${1264 * 0.84}px;margin:0 auto">${crop('style-classic', 0, 56, 1264, 630, 0.84)}</div>
      <div class="chips" style="justify-content:center">${T.karaC.map((c) => `<span>${c}</span>`).join('')}</div></div>`;
  } else if (scene === 'sound') {
    html = `<div class="stage">${brand}<h1>${T.soundH}</h1><p class="sub">${T.soundS}</p>
      <div style="display:flex;gap:40px;align-items:flex-start">
        <div class="cards" style="width:560px">${T.soundC.map(([b, s]) => `<div class="card"><b>${b}</b><span>${s}</span></div>`).join('')}</div>
        <div class="frame" style="background:#fff">${crop('sing-' + lang, PANEL[0], PANEL[1], PANEL[2], 560, 1.0)}</div>
      </div></div>`;
  } else if (scene === 'studio') {
    html = `<div class="stage">${brand}<h1>${T.studioH}</h1><p class="sub" style="margin-bottom:22px">${T.studioS}</p>
      <div style="display:flex;gap:28px;align-items:flex-start">
        <div style="flex:1">
          <div class="frame">${crop('studio-' + lang, ...PLAYER, 756 / 989)}</div>
          <div class="chips">${T.studioC.map((c) => `<span>${c}</span>`).join('')}</div>
        </div>
        <div class="frame" style="background:#fff">${crop('studio-' + lang, PANEL[0], 420, PANEL[2], 568, 1.0)}</div>
      </div></div>`;
  } else if (scene === 'promo') {
    // The tile in the Store's lists: icon, name and a line being sung, readable small.
    const sing = (size, left) => `<div class="sing" style="font-size:${size}px;--left:${left}"><span>${T.promoSing.join('')}</span><i>${T.promoSing.join('')}</i></div>`;
    html = `<div class="hot" style="width:440px;height:280px">
      <div class="rays"></div>
      <span class="note" style="left:182px;top:16px;font-size:30px;transform:rotate(-12deg)">♪</span>
      <span class="note" style="left:398px;top:20px;font-size:26px;transform:rotate(10deg)">♫</span>
      <span class="note" style="left:22px;top:222px;font-size:24px;transform:rotate(-8deg)">♫</span>
      <img class="icon" src="icon-source-1000.png" style="left:24px;top:40px;width:150px;height:150px;border-width:5px;transform:rotate(-8deg)">
      <div class="wm" style="position:absolute;left:196px;top:66px">
        <small style="font-size:18px">Better</small>
        <b style="font-size:57px">Karaoke</b>
      </div>
      <div style="position:absolute;left:194px;top:166px">${sing(21, '44%')}</div>
    </div>`;
  } else if (scene === 'marquee') {
    const sing = (size, left) => `<div class="sing" style="font-size:${size}px;--left:${left}"><span>${T.promoSing.join('')}</span><i>${T.promoSing.join('')}</i></div>`;
    html = `<div class="hot" style="width:1400px;height:560px">
      <div class="rays"></div>
      <span class="note" style="left:470px;top:40px;font-size:64px;transform:rotate(-12deg)">♪</span>
      <span class="note" style="left:600px;top:452px;font-size:54px;transform:rotate(10deg)">♫</span>
      <span class="note" style="left:40px;top:470px;font-size:46px;transform:rotate(-8deg)">♫</span>
      <img class="icon" src="icon-source-1000.png" style="left:70px;top:70px;width:200px;height:200px;border-width:7px;transform:rotate(-8deg)">
      <div class="wm" style="position:absolute;left:300px;top:96px">
        <small style="font-size:30px">Better</small>
        <b style="font-size:104px">Karaoke</b>
      </div>
      <div style="position:absolute;left:72px;top:318px">${sing(38, '44%')}</div>
      <div class="pills" style="position:absolute;left:72px;top:410px;width:600px">${T.promoPills.map((p) => `<span>${p}</span>`).join('')}</div>
      <div class="frame" style="position:absolute;left:740px;top:58px;width:600px;transform:rotate(3deg);border:6px solid #fff;box-shadow:0 30px 70px rgba(110,0,30,.55)">${crop('style-big', 212, 56, 840, 630, 600 / 840)}</div>
      <div class="frame" style="position:absolute;left:1112px;top:372px;width:250px;transform:rotate(4deg);border:5px solid #fff;background:#fff;box-shadow:0 24px 60px rgba(110,0,30,.5)">${crop('panel-' + lang, PANEL[0], PANEL[1], PANEL[2], 255, 250 / PANEL[2])}</div>
    </div>`;
  }
  document.body.append(el(html));
</script>
</body>
</html>
